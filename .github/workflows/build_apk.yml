name: Build and Release APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # Novo passo adicionado para renomear o arquivo gerado
      - name: Renomear APK para MotApp
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/MotApp.apk

      - name: MotApp Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MotApp Versão v1.0.${{ github.run_number }}
          body: "Nova atualização automática do MotApp com melhorias e correções recentes."
          # Caminho atualizado apontando para o novo nome do arquivo
          files: app/build/outputs/apk/debug/MotApp.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
